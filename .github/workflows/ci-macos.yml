name: CI macOS (iOS)

# macOS lane: exact Xcode 26.0.1 / 17A400 / iOS SDK 26.0 measurement (missing
# exact pin = environment blocker, never a silent substitute), pre-build policy
# greps, xcodebuild TEST on the simulator (drives the KMP embedAndSign loop +
# hosted unit tests + M4 XCUITest journey), and post-build Info.plist assertions.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_XCODE: "26.0.1"
      EXPECTED_XCODE_BUILD: "17A400"
      EXPECTED_SDK: "26.0"
      BUNDLE_ID: com.infinityball.pitchpact
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record verified revision
        run: git rev-parse HEAD

      - name: Resolve JDK for Gradle (wrapper-pinned; no host installs)
        run: |
          if [ -n "${JAVA_HOME_21_ARM64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_21_ARM64" >> "$GITHUB_ENV"
          elif command -v /usr/libexec/java_home >/dev/null; then
            echo "JAVA_HOME=$(/usr/libexec/java_home -v21 2>/dev/null || /usr/libexec/java_home -v17 2>/dev/null)" >> "$GITHUB_ENV"
          fi

      - name: Measure exact Xcode pin (blocker if mismatch)
        run: |
          set -euo pipefail
          # Deterministic exact-match selection: enumerate hosted Xcode.app
          # candidates and pick the one MEASURING the pinned version/build.
          # No silent substitution — if nothing matches exactly, this is an
          # environment blocker and we stop.
          pick=""
          for app in /Applications/Xcode*.app/Contents/Developer; do
            # Capture the FULL output via command substitution — piping
            # xcodebuild into `head` races: head exits after line 1, xcodebuild
            # then writes line 2 to a closed pipe and aborts (NSFileHandle
            # broken pipe, exit 134). Verified flake on run 37160673173.
            out=$(DEVELOPER_DIR="$app" xcodebuild -version)
            ver=$(printf '%s\n' "$out" | awk 'NR==1{print $2}')
            build=$(printf '%s\n' "$out" | grep -i 'build version' | awk '{print $3}')
            echo "candidate $app -> $ver ($build)"
            if [ "$ver" = "$EXPECTED_XCODE" ] && [ "$build" = "$EXPECTED_XCODE_BUILD" ]; then
              pick="$app"
            fi
          done
          if [ -z "$pick" ]; then
            echo "::error::Xcode pin mismatch: need $EXPECTED_XCODE ($EXPECTED_XCODE_BUILD); none of the hosted candidates measured exact. Environment blocker — do not substitute another toolchain."
            exit 1
          fi
          echo "DEVELOPER_DIR=$pick" >> "$GITHUB_ENV"
          echo "using $pick"
          # Measure the SDK of the SELECTED candidate specifically — `xcrun`
          # otherwise reports whichever Xcode xcode-select points at globally.
          SDK_VER=$(DEVELOPER_DIR="$pick" xcrun --sdk iphoneos --show-sdk-version)
          echo "measured iphoneos SDK=$SDK_VER for $pick"
          [ "$SDK_VER" = "$EXPECTED_SDK" ] || { echo "::error::iPhoneOS SDK for pinned Xcode is $SDK_VER != $EXPECTED_SDK (environment blocker)"; exit 1; }

      - name: Ensure iOS simulator platform runtime
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # The macos-26 runner image no longer pre-installs the iOS 26.0
          # simulator runtime for Xcode 26.0.1 (actions/runner-images#13570).
          # Installing the pinned Xcode's OWN platform component is NOT a
          # toolchain substitution: the exact 26.0.1 (17A400) pin selected
          # above remains in force.
          SDK_VER=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-$(echo "$SDK_VER" | cut -d. -f1,2 | tr '.' '-')"
          echo "Pinned iphonesimulator SDK: $SDK_VER — required runtime id: $RUNTIME_ID"
          if xcrun simctl list runtimes 2>/dev/null | grep -q "$RUNTIME_ID"; then
            echo "Required runtime already present:"
            xcrun simctl list runtimes | grep "$RUNTIME_ID"
          else
            echo "Required runtime missing — downloading platform for the pinned Xcode (this can take several minutes)..."
            xcrun simctl list > /dev/null 2>&1 || true   # warm the simulator service
            xcodebuild -downloadPlatform iOS -architectureVariant universal || true
            if ! xcrun simctl list runtimes | grep -q "$RUNTIME_ID"; then
              echo "::error::ACCEPTANCE BLOCKER: iOS $SDK_VER simulator runtime could not be installed on this runner (Apple may no longer serve this platform build). Available runtimes:"
              xcrun simctl list runtimes || true
              exit 1
            fi
            echo "Runtime installed:"
            xcrun simctl list runtimes | grep "$RUNTIME_ID"
          fi

      - name: Pre-build policy greps
        run: |
          set -euo pipefail
          PBX=iosApp/PitchPact.xcodeproj/project.pbxproj
          # TARGETED_DEVICE_FAMILY = 1 in EVERY configuration: project, app,
          # hosted unit target and M4 UI target x Debug/Release: 8 entries.
          COUNTS=$(grep -c 'TARGETED_DEVICE_FAMILY = 1;' "$PBX" || true)
          BAD=$(grep -c 'TARGETED_DEVICE_FAMILY' "$PBX" || true)
          [ "$COUNTS" = "8" ] && [ "$BAD" = "8" ] || { echo "device-family pin wrong: $COUNTS/$BAD"; exit 1; }
          # Bundle prefix everywhere: app, unit and UI targets x two configs.
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.infinityball.pitchpact;' "$PBX"
          [ "$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = com.infinityball' "$PBX" || true)" = "6" ]
          [ "$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER' "$PBX" || true)" = "6" ]
          # no forbidden cross-platform UI frameworks anywhere in iOS sources/project
          if grep -rniE '\bflutter\b|react[ -]?native|\bexpo\b|\bunity\b|\bmaui\b|org\.jetbrains\.compose|import SwiftUICompose' iosApp/; then
            echo "forbidden cross-platform UI reference found"; exit 1
          fi
          # SDKROOT is iphoneos everywhere
          [ "$(grep -c 'SDKROOT = iphoneos' "$PBX" || true)" = "2" ]
          echo "pre-build policy greps OK"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-macos-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-macos-

      - name: xcodebuild test (KMP embedAndSign + hosted unit tests + M4 XCUITest journey)
        run: |
          set -euo pipefail
          cd iosApp
          # arm64-only: KMP exports iosSimulatorArm64 (no iosX64 target — none
          # of the fleet builds Intel slices). ARCHS override keeps the lane
          # hermetic: no Intel slice, SDK = the 26.0 bundled with pinned Xcode.
          DEVICE=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone 1"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          [ -n "$DEVICE" ] || { echo "no available iPhone simulator device"; exit 1; }
          echo "using simulator $DEVICE"
          xcodebuild \
            -project PitchPact.xcodeproj \
            -scheme PitchPact \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Post-build Info.plist assertions
        run: |
          set -euo pipefail
          PLIST=iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/PitchPact.app/Info.plist
          test -f "$PLIST" || { echo "missing built Info.plist"; exit 1; }
          FAM=$(plutil -extract UIDeviceFamily xml1 -o - "$PLIST" | grep -o '<integer>[0-9]*</integer>' | tr -cd '0-9')
          [ "$FAM" = "1" ] || { echo "UIDeviceFamily=$FAM (must be [1])"; exit 1; }
          BID=$(plutil -extract CFBundleIdentifier raw -o - "$PLIST")
          [ "$BID" = "$BUNDLE_ID" ] || { echo "CFBundleIdentifier=$BID"; exit 1; }
          echo "post-build assertions OK: UIDeviceFamily=[1] bundle=$BID"

      - name: Upload test results + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            iosApp/build/DerivedData/Logs/Test/**
            iosApp/build/DerivedData/Build/Products/**
          if-no-files-found: warn
